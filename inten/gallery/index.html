<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery - Image Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>gallery</h1>
            <p class="subtitle">Moments worth remembering</p>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search images..." class="search-box">

            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="nature">Nature</button>
                <button class="filter-btn" data-filter="city">City</button>
                <button class="filter-btn" data-filter="abstract">Abstract</button>
                <button class="filter-btn" data-filter="travel">Travel</button>
            </div>
        </div>

        <div class="gallery" id="gallery"></div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="close-btn" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>

            <div class="lightbox-image-wrapper">
                <div class="spinner" id="spinner"></div>
                <img id="lightboxImage" src="" alt="">
            </div>

            <div class="lightbox-footer">
                <div class="image-details">
                    <h3 id="imageTitle"></h3>
                    <span class="counter" id="imageCounter"></span>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn" id="downloadBtn" title="Download Image">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="action-btn" id="shareBtn" title="Copy Link">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
            </div>

            <button class="nav-btn prev" id="prevBtn">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="nav-btn next" id="nextBtn">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
